on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

name: publish

env:
  DOTNET_VERSION: 10.0.x

permissions:
  contents: read
  id-token: write # NuGet trusted publishing

jobs:

  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Check tag matches package version
        run: |
          version=$(dotnet msbuild OscQueryLibrary/OscQueryLibrary.csproj -getProperty:Version)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --project OscQueryLibrary.Tests --configuration Release --no-build

      - name: Pack
        run: dotnet pack OscQueryLibrary/OscQueryLibrary.csproj --configuration Release --no-build --output artifacts

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
